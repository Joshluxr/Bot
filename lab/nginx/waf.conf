# Simulates CloudFront WAF: literal match on "wp-login.php" without URL decoding.
# Bypass: /wp%2Dlogin.php (WAF sees wp%2Dlogin.php; Apache serves wp-login.php).

map $request_uri $block_wp_login_literal {
    default 0;
    ~*wp-login\.php 1;
}

map $request_uri $block_api_users {
    default 0;
    ~*^/api/users/ 1;
}

server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://mock-api:9000/health;
    }

    location /api/ {
        if ($block_api_users) {
            return 403 "WAF: blocked /api/users";
        }
        proxy_pass http://mock-api:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        if ($block_wp_login_literal) {
            return 403 "WAF: blocked wp-login.php (literal match)";
        }
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
